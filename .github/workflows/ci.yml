name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene + manifest JSON
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-publish hygiene scan (HIGH-severity gate)
        shell: pwsh
        run: .\scripts\prepublish-scan.ps1
      # (A standalone plugin/marketplace JSON parse step lived here; it was
      # fully subsumed by check-version-sync.ps1, which parses both files
      # under EAP=Stop and fails identically on malformed JSON.)

      - name: Scaffold rename regression test
        shell: pwsh
        run: .\tests\test-scaffold-rename.ps1

      - name: Scaffold identity regression test
        shell: pwsh
        run: .\tests\test-scaffold-identity.ps1

      - name: SKILL.md spec conformance
        shell: pwsh
        run: .\tests\check-skill-spec.ps1

      - name: Relative markdown links resolve
        shell: pwsh
        run: .\tests\check-links.ps1

      - name: No superseded guidance in the knowledge base
        shell: pwsh
        run: .\tests\check-stale-guidance.ps1

      - name: Long pages carry an accurate table of contents
        shell: pwsh
        run: .\tests\check-toc.ps1

      - name: Version and name agree across manifests
        shell: pwsh
        run: .\tests\check-version-sync.ps1

      - name: Cited paths exist
        shell: pwsh
        run: .\tests\check-cited-paths.ps1

      - name: Cited symbols exist in the file they are cited from
        shell: pwsh
        run: .\tests\check-cited-symbols.ps1

      - name: Shared conventions present in all three templates
        shell: pwsh
        run: .\tests\check-template-parity.ps1

  compile-templates:
    name: C++ templates compile (scaffold + build)
    runs-on: windows-latest
    # windows-latest ships VS 2022 Build Tools; build-xtension.ps1 bootstraps
    # vcvars itself. Compile verification of the templates was manual until
    # 2026-08-16 — this is the gate the template-fix cycles lacked.
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold + compile both C++ templates
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'compile-gate'
          New-Item -ItemType Directory -Force $proj | Out-Null
          Push-Location $proj
          & "$env:GITHUB_WORKSPACE\scripts\new-xtension.ps1" -Name cigatecpp  -Template cpp
          & "$env:GITHUB_WORKSPACE\scripts\new-xtension.ps1" -Name cigatewrap -Template wrapper
          & "$env:GITHUB_WORKSPACE\scripts\build-xtension.ps1" -Name xways-cigatecpp  -NoDeploy
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:GITHUB_WORKSPACE\scripts\build-xtension.ps1" -Name xways-cigatewrap -NoDeploy
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          Write-Host "Both C++ templates scaffold and compile clean."

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    # Was advisory until the docs were lint-clean; all 62 markdown files now
    # pass, so this is a hard gate. Keeping it advisory from here would only
    # let the count drift back up.
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  plugin-validate:
    name: claude plugin validate (best-effort)
    runs-on: ubuntu-latest
    # Best-effort: the Claude Code CLI install/auth may not be available in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI and validate the plugin
        run: |
          npm install -g @anthropic-ai/claude-code || { echo "CLI install unavailable in CI"; exit 0; }
          claude plugin validate . || echo "plugin validate reported issues (or needs auth) — review locally"

  skills-ref:
    name: skills-ref validate (advisory)
    runs-on: ubuntu-latest
    # Advisory only, deliberately. skills-ref is the reference validator from
    # agentskills/agentskills, but it has no PyPI release (it installs from a
    # source checkout) and its authors state it is "intended for demonstration
    # purposes only" and "not meant to be used in production". A second opinion
    # is useful; a hard dependency on it is not. tests/check-skill-spec.ps1 is
    # the actual gate and runs in the hygiene job above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref from source and validate
        run: |
          git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills \
            || { echo "clone unavailable — skipping"; exit 0; }
          pip install -e /tmp/agentskills/skills-ref \
            || { echo "skills-ref install failed — skipping"; exit 0; }
          # Absolute path, not '.': skills-ref derives the skill name from the
          # directory name, and '.' makes it report an empty one.
          skills-ref validate "$PWD" || echo "skills-ref reported issues — review against tests/check-skill-spec.ps1"